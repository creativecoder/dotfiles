# Customize prefix
# unbind C-b
# set -g prefix C-Space

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind M-c attach-session -c "#{pane_current_path}"

# Activate 256 color terminal
# https://github.com/tmux/tmux/wiki/FAQ#how-do-i-use-a-256-colour-terminal
set -g default-terminal "tmux-256color"
# Enable rgb colors
set -a terminal-features 'xterm-256color:RGB'

# Start window/pane numbering with 1; renumber when closed
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Navigate windows using application tab shortcuts
bind -n M-PageDown next-window
bind -n M-PageUp previous-window

# Navigate panes using Ctrl+arrow keys: forward to Helix if running, else navigate tmux panes
bind -n C-Left  if -F '#{==:#{pane_current_command},hx}' 'send-keys C-Left'  'select-pane -L'
bind -n C-Right if -F '#{==:#{pane_current_command},hx}' 'send-keys C-Right' 'select-pane -R'
bind -n C-Up    if -F '#{==:#{pane_current_command},hx}' 'send-keys C-Up'    'select-pane -U'
bind -n C-Down  if -F '#{==:#{pane_current_command},hx}' 'send-keys C-Down'  'select-pane -D'

set -g display-panes-time 2000
set -g default-shell /usr/bin/fish
set -g history-limit 99999
set -g mode-keys vi
set -g mouse on

# Pi configuration
set -g extended-keys on
set -g extended-keys-format csi-u

# set -s history-limit 50000
set -s copy-command 'wl-copy'

# Yazi image preview
# https://yazi-rs.github.io/docs/image-preview/#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

source-file -q ~/.tmux/conf.d/*.conf
